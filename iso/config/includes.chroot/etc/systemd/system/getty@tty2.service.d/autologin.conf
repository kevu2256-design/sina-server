# Automatische Anmeldung des Live-Benutzers auf der zweiten Konsole.
# Konsole 1 ist fuer den grafischen Installations-Manager reserviert.
# WICHTIG: Calamares entfernt diese Datei beim Installieren, damit das
# installierte System eine Anmeldung mit Passwort verlangt.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin sina --noclear %I $TERM
