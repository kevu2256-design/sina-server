# Automatische Anmeldung des Live-Benutzers auf der ersten Konsole.
# WICHTIG: Diese Datei wird von sina-installer bei einer Installation auf
# Datentraeger entfernt, damit das installierte System eine Anmeldung verlangt.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin sina --noclear %I $TERM
