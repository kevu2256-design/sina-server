---
# ---------------------------------------------------------------------------
# Sina Server - Installer-Einstellungen (Calamares)
# ---------------------------------------------------------------------------
modules-search: [ local ]

instances:
- id: sina_cleanup
  module: shellprocess
  config: shellprocess_sina_cleanup.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - services-systemd
  - shellprocess@sina_cleanup
  - packages
  - umount
- show:
  - finished

branding: sina
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
