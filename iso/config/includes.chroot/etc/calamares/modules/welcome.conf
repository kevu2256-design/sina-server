---
# Begruessungsseite mit Systempruefung vor der Installation
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    true
showDonateUrl:          false

requirements:
    requiredStorage:    8
    requiredRam:        1.0

    check:
        - storage
        - ram
        - root
    required:
        - root
        - storage
        - ram

# GeoIP/Internetpruefung deaktiviert (keine externe Anfrage)
geoip:
    style:  "none"
