---
# Live-spezifische Einstellungen im Zielsystem entfernen.
# Laeuft im Chroot des Zielsystems (dontChroot: false).
dontChroot: false
timeout: 600
script:
  - "systemctl disable sina-setup.service 2>/dev/null || true"
  - "rm -f /etc/systemd/system/multi-user.target.wants/sina-setup.service"
  - "rm -f /etc/systemd/system/getty@tty1.service.d/autologin.conf"
  - "rm -f /etc/systemd/system/getty@tty2.service.d/autologin.conf"
  - "rm -rf /root/.config/openbox"
  - "rm -f /etc/sudoers.d/live"
  - "rm -f /etc/ssh/ssh_host_*"
  - "ssh-keygen -A 2>/dev/null || true"
  - "rm -f /var/log/sina/calamares.log"
