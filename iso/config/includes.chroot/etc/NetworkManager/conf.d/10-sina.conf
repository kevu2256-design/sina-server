# ---------------------------------------------------------------------------
# Sina Server - NetworkManager
# ---------------------------------------------------------------------------
[main]
# NetworkManager verwaltet die Namensauflösung selbst und schreibt
# /etc/resolv.conf direkt (kein systemd-resolved erforderlich).
dns=default
plugins=keyfile

[ifupdown]
# Alle Schnittstellen werden von NetworkManager verwaltet.
managed=true

[device]
# Server sollen mit ihrer echten MAC-Adresse im Netz erscheinen.
wifi.scan-rand-mac-address=no
